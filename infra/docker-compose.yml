version: '3.9'

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: escrow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'

  api:
    build:
      context: ..
      dockerfile: infra/dockerfiles/api.Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/escrow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_me
      LINE_CHANNEL_ID: demo
      LINE_CHANNEL_SECRET: demo
      NEXTAUTH_SECRET: change_me
      APP_BASE_URL: http://localhost:3000
      PAYMENT_WEBHOOK_SECRET: mock_secret
      AUTO_RELEASE_HOURS: 48
    ports:
      - '4000:4000'

  web:
    build:
      context: ..
      dockerfile: infra/dockerfiles/web.Dockerfile
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    ports:
      - '3000:3000'

volumes:
  postgres-data:
