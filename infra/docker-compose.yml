version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: escrow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/escrow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_me
      LINE_CHANNEL_ID: demo
      LINE_CHANNEL_SECRET: demo
      NEXTAUTH_SECRET: change_me
      APP_BASE_URL: http://localhost:3000
      PAYMENT_WEBHOOK_SECRET: mock_secret
      AUTO_RELEASE_HOURS: 48
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: pnpm --filter api worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/escrow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_me
      LINE_CHANNEL_ID: demo
      LINE_CHANNEL_SECRET: demo
      NEXTAUTH_SECRET: change_me
      APP_BASE_URL: http://localhost:3000
      PAYMENT_WEBHOOK_SECRET: mock_secret
      AUTO_RELEASE_HOURS: 48
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_MOCK_WEBHOOK_SECRET: mock_secret
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
