version: '3.9'
services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: escrow
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    restart: always
    ports:
      - '6379:6379'
  api:
    build:
      context: ../
      dockerfile: apps/api/Dockerfile
    env_file: ../.env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/escrow
      REDIS_URL: redis://redis:6379
      APP_BASE_URL: http://localhost:3000
    depends_on:
      - postgres
      - redis
    ports:
      - '4000:4000'
  web:
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
    env_file: ../.env.example
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    depends_on:
      - api
    ports:
      - '3000:3000'
volumes:
  postgres_data:
