version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: essy-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: escrow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: essy-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: essy-api
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/escrow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_min_32_chars}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:-demo}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-demo}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change_me_in_production_min_32_chars}
      APP_BASE_URL: http://localhost:3000
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-mock_secret}
      AUTO_RELEASE_HOURS: ${AUTO_RELEASE_HOURS:-48}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages:/app/packages
      - /app/node_modules
    command: pnpm --filter @essy/api dev

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: essy-web
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ../apps/web:/app/apps/web
      - ../packages:/app/packages
      - /app/node_modules
      - /app/.next
    command: pnpm --filter @essy/web dev

volumes:
  postgres_data:
