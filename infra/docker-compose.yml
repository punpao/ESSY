version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: escrow
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
  api:
    build:
      context: ..
      dockerfile: ./infra/dockerfiles/api.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/escrow}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:-demo}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-demo}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-mock_secret}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      AUTO_RELEASE_HOURS: ${AUTO_RELEASE_HOURS:-48}
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"
  web:
    build:
      context: ..
      dockerfile: ./infra/dockerfiles/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api/v1}
    depends_on:
      - api
    ports:
      - "3000:3000"
  worker:
    build:
      context: ..
      dockerfile: ./infra/dockerfiles/api.Dockerfile
    command: ["pnpm", "--filter", "@thai-escrow/api", "worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/escrow}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:-demo}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-demo}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-mock_secret}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      AUTO_RELEASE_HOURS: ${AUTO_RELEASE_HOURS:-48}
    depends_on:
      - postgres
      - redis
