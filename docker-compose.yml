version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: thai-escrow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: escrow
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: thai-escrow-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: thai-escrow-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/escrow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_me_in_production
      NEXTAUTH_SECRET: change_me_in_production
      LINE_CHANNEL_ID: demo
      LINE_CHANNEL_SECRET: demo
      APP_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:3001
      PAYMENT_WEBHOOK_SECRET: mock_secret
      AUTO_RELEASE_HOURS: 48
      PORT: 3001
      NODE_ENV: production
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules
    command: sh -c "cd apps/api && npx prisma migrate deploy && node dist/index.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: thai-escrow-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '3000:3000'
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next

volumes:
  postgres_data:
  redis_data:
